name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - name: Fetch public data set (cached outside git)
        run: python -m toolwear fetch
      - run: pytest -p no:asyncio
      - name: One-command demo
        run: python -m toolwear demo --out demo-out
